<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mishk</title>
<style>
@font-face{font-family:Plex;font-weight:400;src:url(data:font/woff2;base64,{{FONT_400}}) format("woff2")}
@font-face{font-family:Plex;font-weight:500;src:url(data:font/woff2;base64,{{FONT_500}}) format("woff2")}
@font-face{font-family:Plex;font-weight:600;src:url(data:font/woff2;base64,{{FONT_600}}) format("woff2")}

:root,[data-theme=dark]{
  --bg:#17191c; --panel:#1f2226; --raise:#262a2f; --line:#353a41; --line-2:#454b54;
  --text:#eceef0; --muted:#98a1ac; --faint:#6b737d;
  --amber:#f0b040; --amber-ink:#1d1606; --amber-soft:rgba(240,176,64,.14);
  --ok:#5ccb8a; --low:#e5604e;
  --body:#2b2f35; --body-2:#33383f; --steel:#8c949e; --knurl:#59606a;
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#eceef1; --panel:#ffffff; --raise:#f5f6f8; --line:#d7dbe0; --line-2:#c3c9d0;
  --text:#1c2025; --muted:#5d6670; --faint:#8a929b;
  --amber:#b97700; --amber-ink:#ffffff; --amber-soft:rgba(185,119,0,.12);
  --ok:#1f9a59; --low:#c8402f;
  --body:#dfe3e8; --body-2:#cfd5dc; --steel:#7a838e; --knurl:#a3abb5;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 14px/1.55 Plex,"Segoe UI",Tahoma,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:212px 1fr;height:100vh}
nav{background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.brand svg{flex:none}
.brand b{font-weight:600;font-size:17px;letter-spacing:.2px}
.brand small{display:block;color:var(--faint);font-size:11.5px;line-height:1.2}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;margin-bottom:2px;border:0;border-radius:8px;
  background:none;color:var(--muted);cursor:pointer;text-align:start;font-weight:500}
.navbtn svg{width:19px;height:19px;flex:none}
.navbtn:hover{background:var(--raise);color:var(--text)}
.navbtn[aria-current=page]{background:var(--amber-soft);color:var(--text)}
.navbtn[aria-current=page] svg{color:var(--amber)}
.navfoot{margin-top:auto;padding:10px 12px 0;border-top:1px solid var(--line);color:var(--faint);font-size:12px}
.pause{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;color:var(--muted)}

main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
header{display:flex;align-items:center;gap:18px;padding:18px 28px;border-bottom:1px solid var(--line);min-height:76px}
.devname{font-size:20px;font-weight:600;line-height:1.2}
.devmeta{color:var(--muted);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.on{background:var(--ok)}
.battery{margin-inline-start:auto;display:flex;align-items:center;gap:12px}
.cells{display:flex;gap:3px;direction:ltr}
.cells i{width:7px;height:18px;border-radius:2px;background:var(--line)}
.cells i.f{background:var(--ok)}
.cells.low i.f{background:var(--low)}
.battery b{font-size:20px;font-weight:600;min-width:52px;text-align:end}
.battery span{color:var(--muted);font-size:12px;display:block;text-align:end}
.content{flex:1;overflow:auto;padding:24px 28px 40px}
.banner{display:flex;align-items:center;gap:14px;margin:16px 28px 0;padding:12px 16px;border:1px solid var(--amber);
  border-radius:10px;background:var(--amber-soft)}
.banner p{margin:0;flex:1}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line-2);background:var(--raise);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--steel)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--line)}
.btn.danger:hover{border-color:var(--low);color:var(--low)}
select,input[type=text],textarea{background:var(--raise);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%}
select{cursor:pointer}
select:hover,input[type=text]:hover{border-color:var(--steel)}
.switch{position:relative;width:38px;height:22px;flex:none;appearance:none;-webkit-appearance:none;margin:0;
  background:var(--line-2);border-radius:11px;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch:checked{background:var(--amber)}
.switch:checked::after{inset-inline-start:19px}
input[type=range]{width:100%;accent-color:var(--amber);cursor:pointer;direction:ltr}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:3px;gap:3px;background:var(--raise);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line-2)}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lbl{flex:1}
.row .lbl b{font-weight:500;display:block}
.section{max-width:760px}
.section h2{font-size:15px;font-weight:600;margin:28px 0 4px}
.section h2:first-child{margin-top:0}
.slider{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:12px 0}
.slider output{min-width:70px;text-align:end;font-weight:600}
.slider .ends{grid-column:1;display:flex;justify-content:space-between;color:var(--faint);font-size:12px;direction:ltr}

/* ---------- buttons page ---------- */
.ctxbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line-2);background:none;border-radius:999px;padding:5px 13px;cursor:pointer;color:var(--muted);font-weight:500}
.chip:hover{color:var(--text)}
.chip[aria-pressed=true]{border-color:var(--amber);color:var(--text);background:var(--amber-soft)}
.btnpage{display:grid;grid-template-columns:minmax(360px,1fr) 320px;gap:20px;align-items:start}
.diagram{position:relative;width:100%;max-width:760px;aspect-ratio:760/560;direction:ltr}
.diagram svg{position:absolute;inset:0;width:100%;height:100%}
.callout{position:absolute;width:25.5%;transform:translateY(-50%);border:1px solid var(--line-2);background:var(--panel);
  border-radius:9px;padding:7px 11px;cursor:pointer;text-align:start;transition:border-color .12s}
.callout:hover{border-color:var(--steel)}
.callout[aria-pressed=true]{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.callout small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35}
.callout span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:500;line-height:1.35;overflow:hidden;font-size:13px}
.callout.inherit span{color:var(--faint);font-weight:400}
.diagram.off{opacity:.55}
.diagram.arrange .hs{cursor:grab}
.diagram.arrange .hsdot{r:8}
.halo{fill:var(--amber);opacity:.22}
.photo .hsdot{stroke:#fff;stroke-width:2;fill:rgba(0,0,0,.55)}
.photo .hsdot.sel{fill:var(--amber);stroke:#fff}
.photo .lead{stroke:rgba(255,255,255,.55)}
.photo .lead.sel{stroke:var(--amber)}
.phbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.phbar .slider{flex:1;min-width:200px;padding:0;grid-template-columns:auto 1fr;gap:10px}
.hs{cursor:pointer}
.lead{stroke:var(--line-2);stroke-width:1.2;fill:none}
.lead.sel{stroke:var(--amber);stroke-width:1.6}
.hsdot{fill:var(--panel);stroke:var(--steel);stroke-width:1.6}
.hsdot.sel{fill:var(--amber);stroke:var(--amber)}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:0}
.editor h3{margin:0 0 2px;font-size:16px;font-weight:600}
.editor .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.field{margin-top:14px}
.field>label{display:block;color:var(--muted);font-size:12.5px;margin-bottom:6px}
.capture{display:flex;gap:6px}
.capture input{direction:ltr;text-align:center;font-weight:600;cursor:text}
.capture input.rec{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.wintog{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-top:8px}
.glist{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.glist .gl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;min-width:64px}
.glist .gl svg{width:18px;height:18px;flex:none;color:var(--amber)}
.glist select{padding:6px 8px}

/* ---------- apps ---------- */
.plist{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.prow{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .ico{width:34px;height:34px;border-radius:8px;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;color:var(--amber);flex:none}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-weight:500}
.prow .nm small{color:var(--muted);direction:ltr;display:inline-block}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- device ---------- */
.hosts{display:flex;gap:10px}
.host{width:64px;height:58px;border:1px solid var(--line-2);border-radius:10px;background:var(--raise);cursor:pointer;display:grid;place-items:center;font-size:18px;font-weight:600}
.host[aria-pressed=true]{border-color:var(--amber);background:var(--amber-soft)}
.host small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:-6px}
textarea.log{height:220px;direction:ltr;font-size:12px;line-height:1.45;resize:vertical;font-family:Consolas,monospace;user-select:text}
.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);
  padding:8px 16px;border-radius:8px;font-weight:500;transition:opacity .18s,transform .18s;pointer-events:none}
[dir=rtl] .toast{transform:translateX(50%) translateY(20px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[dir=rtl] .toast.show{transform:translateX(50%) translateY(0)}
.nodev{border:1px dashed var(--line-2);border-radius:12px;padding:16px 18px;margin-bottom:18px;color:var(--muted)}
.nodev b{color:var(--text);font-weight:500}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px;z-index:10}
.dialog{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;width:min(540px,100%);padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.dialog h3{margin:0 0 14px;font-size:18px;font-weight:600}
.dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
.steps{margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.steps li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:12.5px;color:var(--muted)}
.wait{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--raise);color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--amber);animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.clicks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 10px}
.click{border:1px solid var(--line-2);border-radius:10px;padding:10px 4px;text-align:center;background:var(--raise);font-weight:600}
.click svg{display:block;margin:0 auto 4px;width:30px;height:38px}
.click small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.click.done{border-color:var(--ok);opacity:.55}
.click.next{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.code{font-size:34px;font-weight:600;letter-spacing:6px;text-align:center;direction:ltr;margin:14px 0}
.ok-ico{width:46px;height:46px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin-bottom:12px}
.dlist .prow{padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:1000px){.btnpage{grid-template-columns:1fr}.editor{position:static}}
@media (max-width:760px){.app{grid-template-columns:64px 1fr}.navbtn span,.brand div,.navfoot{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="app">
  <nav aria-label="sections">
    <div class="brand">

    <button class="navbtn" data-page="apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M17 14v6M14 17h6"/></svg><span></span></button>

    <div class="navfoot">
      <label class="pause"><span id="t-pause"></span><input type="checkbox" class="switch" id="pause"></label>
      <div id="ver"></div>

  </nav>
  <main>
    <header id="hdr"></header>
    <div id="banner"></div>
    <div class="content" id="page"></div>
  </main>
</div>
<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

function actKey(a){ if(!a) return "inherit"; if(["builtin","media","mouse"].includes(a.type)) return a.type+":"+a.value; return a.type; }
function keyAct(k){ const i=k.indexOf(":"); return i<0 ? {type:k} : {type:k.slice(0,i), value:k.slice(i+1)}; }
function actLabel(a, btn){
  if(!a || a.type==="inherit") return t("a_inherit");
  switch(a.type){
    case "default": return btn ? t("native_"+btn) : t("a_default");
    case "none": return t("a_none");
    case "keys": return a.value || t("a_keys");
    case "run": return a.value ? a.value.split(/[\\/]/).filter(Boolean).pop() : t("a_run");
    case "gestures": return t("a_gestures");
    case "mouse": return t("a_m_"+a.value);
    default: return t("a_"+a.value);
  }
}
function wheelLabel(w){ if(!w || w.type==="inherit") return t("w_inherit"); if(w.type==="custom") return [w.left,w.right].filter(Boolean).join(" / ") || t("w_custom"); return t("w_"+w.type); }
function options(cur, {gestures=false, inherit=false, keyOnly=false}={}){
  let h = "";
  if(inherit) h += `<option value="inherit"${cur==="inherit"?" selected":""}>${esc(t("a_inherit"))}</option>`;
  for(const [g, list] of CATALOG){
    let items = list.slice();
    if(g==="grp_custom" && gestures) items.push("gestures");
    h += `<optgroup label="${esc(t(g))}">` + items.map(k=>{
      const lbl = k==="default"||k==="none"||k==="keys"||k==="run"||k==="gestures" ? t("a_"+k) : actLabel(keyAct(k));
      return `<option value="${k}"${k===cur?" selected":""}>${esc(lbl)}</option>`;
    }).join("") + `</optgroup>`;
  }
  return h;
}

// Where each button usually sits on a top-down photo of an MX Master,
// as a fraction of the mouse's own outline (x from its left edge, y from its front).
const PHOTO_SPOTS = {middle:[.390,.063], top:[.477,.166], thumb:[.207,.336], forward:[.154,.380], back:[.174,.435], gesture:[.077,.711]};

// Cut away a plain background (transparent, white or any flat colour) and crop to the mouse.
function cutOut(img){
  const cv = document.createElement("canvas"); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const cx = cv.getContext("2d", {willReadFrequently:true}); cx.drawImage(img, 0, 0);
  const W = cv.width, H = cv.height, id = cx.getImageData(0, 0, W, H), d = id.data;
  const at = (x,y) => (y*W + x)*4;
  const corners = [at(0,0), at(W-1,0), at(0,H-1), at(W-1,H-1)];
  const transparent = corners.some(i => d[i+3] < 200);
  if(!transparent){
    const ref = corners.map(i => [d[i],d[i+1],d[i+2]]);
    const flat = ref.every(c => Math.abs(c[0]-ref[0][0]) + Math.abs(c[1]-ref[0][1]) + Math.abs(c[2]-ref[0][2]) < 60);
    if(flat){
      const [br,bgc,bb] = ref[0], tol = 48;
      const seen = new Uint8Array(W*H), stack = [];
      for(let x=0;x<W;x++){ stack.push(x, (H-1)*W + x); }
      for(let y=0;y<H;y++){ stack.push(y*W, y*W + W-1); }
      while(stack.length){
        const p = stack.pop(); if(seen[p]) continue; seen[p] = 1;
        const i = p*4, diff = Math.abs(d[i]-br) + Math.abs(d[i+1]-bgc) + Math.abs(d[i+2]-bb);
        if(diff > tol) continue;
        d[i+3] = diff < tol/2 ? 0 : Math.round(255 * (diff - tol/2) / (tol/2));
        const x = p % W, y = (p - x) / W;
        if(x>0) stack.push(p-1); if(x<W-1) stack.push(p+1); if(y>0) stack.push(p-W); if(y<H-1) stack.push(p+W);
      }
      cx.putImageData(id, 0, 0);
    }
  }
  // crop to what is left
  let x0=W, y0=H, x1=-1, y1=-1;
  for(let y=0;y<H;y+=2) for(let x=0;x<W;x+=2){ if(d[at(x,y)+3] > 24){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1 < 0 || (x1-x0) < W*0.05){ x0=0; y0=0; x1=W-1; y1=H-1; }
  const cw = x1-x0+1, ch = y1-y0+1, k = Math.min(1, 1400/Math.max(cw,ch));
  const out = document.createElement("canvas"); out.width = Math.round(cw*k); out.height = Math.round(ch*k);
  out.getContext("2d").drawImage(cv, x0, y0, cw, ch, 0, 0, out.width, out.height);
  const cut = transparent || out.toDataURL !== undefined && x1 - x0 + 1 < W;
  return {url: out.toDataURL("image/png"), w: out.width, h: out.height};
}
function defaultSpots(w, h){
  const b = photoBox(), r = Math.min(b.w / w, b.h / h), dw = w*r, dh = h*r, ox = b.x + (b.w-dw)/2, oy = b.y + (b.h-dh)/2;
  const o = {}; for(const k in PHOTO_SPOTS){ const [fx,fy] = PHOTO_SPOTS[k]; o[k] = [Math.round(ox + fx*dw), Math.round(oy + fy*dh)]; }
  return o;
}
$("#photoFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  try {
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("image")); i.src = url; });
    const c = cutOut(img);
    const st = await api("setPhoto", c.url);
    S.config = st.config; UI.photo = c.url;
    cfg().photoScale = 1; cfg().photoShift = [0,0]; cfg().photoSpots = defaultSpots(c.w, c.h);
    save(true); UI.arrange = true; renderPage();
  } catch(err){ toast(t("err") + (err.message||err)); }
};

/* ================= pairing ================= */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-pair]"); if(!b) return;
  S.pairing = {active:true, stage:"discovering", clicks:[], pressed:0};
  renderModal();
  api("startPairing", b.dataset.pair || "");
});
const MOUSE_BTN = side => `<svg viewBox="0 0 30 38" aria-hidden="true"><path d="M15 2C8 2 3 7 3 14v10c0 7 5 12 12 12s12-5 12-12V14C27 7 22 2 15 2Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15 2v14M3 16h24" stroke="currentColor" stroke-width="1.4"/><path d="${side==="left"?"M4.5 15V14C4.5 8 9 3.5 14 3.4V15Z":"M25.5 15V14C25.5 8 21 3.5 16 3.4V15Z"}" fill="var(--amber)"/></svg>`;
function renderModal(){
  const el = $("#modal"), p = S && S.pairing;
  if(!p || p.stage==="cancelled"){ el.innerHTML = ""; return; }
  const name = p.name || "MX Master 3S";
  let body = "", acts = "";
  const cancel = `<button class="btn" id="pwCancel">${esc(t("pw_cancel"))}</button>`;
  switch(p.stage){
    case "waiting":
      body = `<ol class="steps"><li>${esc(t("pw_u1"))}</li><li>${esc(t("pw_u2"))}</li></ol><div class="wait"><span class="spin"></span>${esc(t("pw_wait"))}</div>`;
      acts = cancel; break;
    case "discovering":
      body = `<ol class="steps"><li>${esc(t("pw_s1"))}</li><li>${esc(t("pw_s2"))}</li><li>${esc(t("pw_s3"))}</li></ol>
        <div class="wait"><span class="spin"></span>${esc(t("pw_search"))}</div>`;
      acts = cancel; break;
    case "pairing":
      body = `<div class="wait"><span class="spin"></span>${esc(t("pw_found", name))}</div>`; acts = cancel; break;
    case "passkey":
      if(p.keyboard){
        body = `<p>${esc(t("pw_type", name))}</p><div class="code num">${esc(p.passkey)}</div>`;
      } else {
        body = `<p>${esc(t("pw_clicks", name))}</p><div class="clicks">` + (p.clicks||[]).map((c,i)=>
          `<div class="click ${i<p.pressed?"done":""} ${i===p.pressed?"next":""}">${MOUSE_BTN(c)}${esc(t(c==="left"?"pw_left":"pw_right"))}<small class="num">${i+1}</small></div>`).join("") +
          `</div><p class="hint">${esc(t("pw_both"))}</p>`;
      }
      acts = cancel; break;
    case "done":
      body = `<div class="ok-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg></div><p style="font-size:16px;font-weight:600;margin:0 0 4px">${esc(t("pw_done", name))}</p><p class="hint">${esc(t("pw_done_b"))}</p>`;
      acts = `<button class="btn primary" id="pwClose">${esc(t("pw_close"))}</button>`; break;
    default:
      body = `<p style="font-weight:600;margin:0 0 6px">${esc(t("pw_fail"))}</p><p class="hint">${esc(t("pw_err_"+(p.error||"failed")))}</p>`;
      acts = `<button class="btn" id="pwClose">${esc(t("pw_close"))}</button><button class="btn primary" data-pair="${esc(p.link||"")}">${esc(t("pw_retry"))}</button>`;
  }
  el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="pwT"><div class="dialog"><h3 id="pwT">${p.unifying ? esc(t("pw_title_uni")) : htx("pw_title")}</h3>${body}<div class="acts">${acts}</div></div></div>`;
  const c = $("#pwCancel"); if(c) c.onclick = () => { api("cancelPairing"); S.pairing = null; renderModal(); };
  const x = $("#pwClose"); if(x) x.onclick = () => { api("clearPairing"); S.pairing = null; renderModal(); renderPage(); };
}

/* ================= start ================= */
document.querySelectorAll(".navbtn").forEach(b => b.onclick = () => { UI.page = b.dataset.page; if(UI.page==="apps") UI.apps = null; renderChrome(); renderPage(); $("#page").scrollTop = 0; });
$("#pause").onchange = e => { cfg().paused = e.target.checked; save(true); };
document.addEventListener("contextmenu", e => { if(!e.target.closest("textarea,input")) e.preventDefault(); });

(async function start(){
  S = await api("state");
  try { UI.photo = (await api("photo")) || ""; } catch(e){ UI.photo = ""; }
  if(location.hash.startsWith("#page=")) UI.page = location.hash.slice(6).split("&")[0];
  if(location.hash==="#en") S.config.lang = "en";
  if(location.hash==="#light") S.config.theme = "light";
  renderChrome(); renderPage(); renderModal();
})();
</script>
</body>
</html>
